type IssuerAllowlisted @entity(immutable: true) {
  id: Bytes!
  templateId: Bytes! # bytes32
  issuer: Bytes! # address
  allowed: Boolean! # bool
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type OwnershipTransferred @entity(immutable: true) {
  id: Bytes!
  previousOwner: Bytes! # address
  newOwner: Bytes! # address
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type TemplateRegistered @entity(immutable: true) {
  id: Bytes!
  templateId: Bytes! # bytes32
  schemaUid: Bytes! # bytes32
  expiryWindowSeconds: BigInt! # uint64
  stalenessWindowSeconds: BigInt! # uint64
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type Verified @entity(immutable: true) {
  id: Bytes!
  trustId: BigInt! # uint256
  attestationUid: Bytes! # bytes32
  beneficiary: Bytes! # address
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}
