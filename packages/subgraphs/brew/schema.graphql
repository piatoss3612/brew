type OwnershipTransferred @entity(immutable: true) {
  id: Bytes!
  previousOwner: Bytes! # address
  newOwner: Bytes! # address
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type Refunded @entity(immutable: true) {
  id: Bytes!
  trustId: BigInt! # uint256
  sponsor: Bytes! # address
  amount: BigInt! # uint256
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type Released @entity(immutable: true) {
  id: Bytes!
  trustId: BigInt! # uint256
  beneficiary: Bytes! # address
  amount: BigInt! # uint256
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type TrustCreated @entity(immutable: true) {
  id: Bytes!
  trustId: BigInt! # uint256
  sponsor: Bytes! # address
  beneficiary: Bytes! # address
  templateId: Bytes! # bytes32
  token: Bytes! # address
  amount: BigInt! # uint256
  deadline: BigInt! # uint64
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type VerifierUpdated @entity(immutable: true) {
  id: Bytes!
  verifier: Bytes! # address
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}
