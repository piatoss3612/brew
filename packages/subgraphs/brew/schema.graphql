type Trust @entity(immutable: false) {
  id: ID!
  trustId: BigInt!
  sponsor: Bytes!
  beneficiary: Bytes!
  token: Bytes!
  amount: BigInt!
  deadline: BigInt!
  templateId: Bytes!
  status: String!
  attestationUid: Bytes
  createdAt: BigInt!
  createdBlock: BigInt!
  createdTx: Bytes!
  releasedAt: BigInt
  releasedTx: Bytes
  refundedAt: BigInt
  refundedTx: Bytes
  verifiedAt: BigInt
  verifiedTx: Bytes
}

type Verification @entity(immutable: true) {
  id: Bytes!
  trust: Trust!
  trustId: BigInt!
  attestationUid: Bytes!
  beneficiary: Bytes!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type Template @entity(immutable: false) {
  id: ID!
  templateId: Bytes!
  schemaUid: Bytes!
  expiryWindowSeconds: BigInt!
  stalenessWindowSeconds: BigInt!
  registeredAt: BigInt!
  registeredTx: Bytes!
}

type IssuerPermission @entity(immutable: false) {
  id: ID!
  templateId: Bytes!
  issuer: Bytes!
  allowed: Boolean!
  updatedAt: BigInt!
  updatedTx: Bytes!
}

type VerifierConfig @entity(immutable: false) {
  id: ID!
  verifier: Bytes!
  updatedAt: BigInt!
  updatedTx: Bytes!
}
