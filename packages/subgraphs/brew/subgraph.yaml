specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: BrewEscrow
    network: base-sepolia
    source:
      address: "0x9Ddb398600E37a7b68936D316b6889EE21e0EAe9"
      abi: BrewEscrow
      startBlock: 40974389
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Trust
        - VerifierConfig
      abis:
        - name: BrewEscrow
          file: ./abis/BrewEscrow.json
      eventHandlers:
        - event: Refunded(indexed uint256,indexed address,uint256)
          handler: handleRefunded
        - event: Released(indexed uint256,indexed address,uint256)
          handler: handleReleased
        - event: TrustCreated(indexed uint256,indexed address,indexed address,bytes32,address,uint256,uint64)
          handler: handleTrustCreated
        - event: VerifierUpdated(indexed address)
          handler: handleVerifierUpdated
      file: ./src/brew-escrow.ts
  - kind: ethereum
    name: AttestationVerifier
    network: base-sepolia
    source:
      address: "0xe9aD090798B0CEDb2aaCA48d202f02071ccfb7e5"
      abi: AttestationVerifier
      startBlock: 40974390
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - IssuerPermission
        - ReviewCoordinatorPermission
        - ReviewReceipt
        - Template
        - Trust
        - Verification
      abis:
        - name: AttestationVerifier
          file: ./abis/AttestationVerifier.json
      eventHandlers:
        - event: IssuerAllowlisted(indexed bytes32,indexed address,bool)
          handler: handleIssuerAllowlisted
        - event: ReviewCoordinatorAllowlisted(indexed address,bool)
          handler: handleReviewCoordinatorAllowlisted
        - event: ReviewReceiptAccepted(indexed uint256,indexed bytes32,indexed address,bytes32,string)
          handler: handleReviewReceiptAccepted
        - event: TemplateRegistered(indexed bytes32,bytes32,uint64,uint64)
          handler: handleTemplateRegistered
        - event: Verified(indexed uint256,indexed bytes32,address)
          handler: handleVerified
      file: ./src/attestation-verifier.ts
